<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0f;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #ui-panel {
            width: 100%;
            height: 60px;
            background-color: #3c3c3c;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            border-bottom: 2px solid #555;
        }

        .button {
            padding: 10px 15px;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            color: white;
            font-size: 14px;
            user-select: none;
        }

        .button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(0.95);
        }

        #btn-play {
            background-color: #00c864;
        }

        #btn-pause {
            background-color: #c83232;
        }

        #btn-step-forward {
            background-color: #6496c8;
        }

        #btn-step-backward {
            background-color: #6496c8;
        }

        #btn-clear {
            background-color: #3c3c3c;
        }

        #btn-random {
            background-color: #3c3c3c;
        }

        #btn-speed-slower {
            background-color: #9664c8;
        }

        #btn-speed-faster {
            background-color: #9664c8;
        }

        #info {
            margin-left: auto;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-right: 20px;
        }

        #canvas-container {
            flex: 1;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            #ui-panel {
                flex-wrap: wrap;
                height: auto;
                gap: 5px;
                padding: 5px;
            }

            .button {
                padding: 8px 12px;
                font-size: 12px;
            }

            #info {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="ui-panel">
            <button id="btn-play" class="button">Play</button>
            <button id="btn-pause" class="button">Pause</button>
            <button id="btn-step-forward" class="button">Step ></button>
            <button id="btn-step-backward" class="button">Step <</button>
            <button id="btn-clear" class="button">Clear</button>
            <button id="btn-random" class="button">Random</button>
            <button id="btn-speed-slower" class="button">Speed <<</button>
            <button id="btn-speed-faster" class="button">Speed >></button>
            <div id="info"></div>
        </div>
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const CELL_SIZE = 10;
        const SPEEDS = [0.5, 1, 2, 3, 4, 5, 10, 20, 30, 50, 100, 500, 1000];
        let speedIndex = 1;
        let currentSpeed = SPEEDS[speedIndex];
        const BASE_INTERVAL = 100; // milliseconds

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');

        let gridWidth, gridHeight;
        let grid = [];
        let age = [];
        let history = [];
        let historyAge = [];
        let generation = 0;
        let paused = true;
        let lastUpdateTime = Date.now();

        // Initialize on load
        window.addEventListener('load', () => {
            resizeCanvas();
            initializeGrid(true);
            gameLoop();
        });

        // Handle window resize
        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const newGridWidth = Math.floor(canvas.width / CELL_SIZE);
            const newGridHeight = Math.floor(canvas.height / CELL_SIZE);

            if (newGridWidth !== gridWidth || newGridHeight !== gridHeight) {
                const oldGridWidth = gridWidth;
                const oldGridHeight = gridHeight;
                gridWidth = newGridWidth;
                gridHeight = newGridHeight;

                if (oldGridWidth !== undefined) {
                    resizeGrid(oldGridWidth, oldGridHeight);
                }
            }
        }

        function resizeGrid(oldWidth, oldHeight) {
            const newGrid = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(0));
            const newAge = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(0));

            for (let row = 0; row < Math.min(oldHeight, gridHeight); row++) {
                for (let col = 0; col < Math.min(oldWidth, gridWidth); col++) {
                    newGrid[row][col] = grid[row][col];
                    newAge[row][col] = age[row][col];
                }
            }

            grid = newGrid;
            age = newAge;
        }

        function initializeGrid(randomize = true) {
            grid = Array(gridHeight).fill(null).map(() => 
                Array(gridWidth).fill(0).map(() => randomize ? Math.random() > 0.7 ? 1 : 0 : 0)
            );
            age = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(0));
            history = [];
            historyAge = [];
            generation = 0;
            paused = true;
        }

        function countNeighbors(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    const r = (row + i + gridHeight) % gridHeight;
                    const c = (col + j + gridWidth) % gridWidth;
                    count += grid[r][c];
                }
            }
            return count;
        }

        function updateGrid() {
            const newGrid = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(0));
            const newAge = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(0));

            for (let row = 0; row < gridHeight; row++) {
                for (let col = 0; col < gridWidth; col++) {
                    const neighbors = countNeighbors(row, col);

                    if (grid[row][col] === 1) {
                        if (neighbors === 2 || neighbors === 3) {
                            newGrid[row][col] = 1;
                            newAge[row][col] = age[row][col] + 1;
                        }
                    } else {
                        if (neighbors === 3) {
                            newGrid[row][col] = 1;
                            newAge[row][col] = 0;
                        }
                    }
                }
            }

            grid = newGrid;
            age = newAge;
        }

        function getCellColor(cellAge) {
            const ageClamped = Math.min(cellAge, 30);
            const brightness = Math.max(100, 255 - (ageClamped * 4));
            const g = Math.min(255, 150 + ageClamped * 2);
            return `rgb(100, ${g}, ${brightness})`;
        }

        function draw3DCell(x, y, size, color) {
            // Parse color to get RGB values
            const rgb = color.match(/\d+/g).map(Number);
            
            // Main cell body
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);

            // Top and left highlight
            ctx.strokeStyle = `rgb(${Math.min(rgb[0] + 60, 255)}, ${Math.min(rgb[1] + 60, 255)}, ${Math.min(rgb[2] + 60, 255)})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + size, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + size);
            ctx.stroke();

            // Bottom and right shadow
            ctx.strokeStyle = `rgb(${Math.max(rgb[0] - 80, 0)}, ${Math.max(rgb[1] - 80, 0)}, ${Math.max(rgb[2] - 80, 0)})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + size, y);
            ctx.lineTo(x + size, y + size);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y + size);
            ctx.lineTo(x + size, y + size);
            ctx.stroke();

            // Corner highlight
            if (size > 4) {
                ctx.fillStyle = `rgb(${Math.min(rgb[0] + 100, 255)}, ${Math.min(rgb[1] + 100, 255)}, ${Math.min(rgb[2] + 100, 255)})`;
                ctx.fillRect(x + 1, y + 1, size - 3, size - 3);
            }
        }

        function drawGrid() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < gridHeight; row++) {
                for (let col = 0; col < gridWidth; col++) {
                    const x = col * CELL_SIZE;
                    const y = row * CELL_SIZE;

                    if (grid[row][col] === 1) {
                        const cellColor = getCellColor(age[row][col]);
                        draw3DCell(x, y, CELL_SIZE, cellColor);
                    } else {
                        // Dead cell grid
                        ctx.fillStyle = '#141419';
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#232328';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            updateInfo();
        }

        function updateInfo() {
            const speedText = currentSpeed >= 1 ? `${currentSpeed}x` : `${currentSpeed}x`;
            const status = paused ? 'PAUSED' : 'RUNNING';
            infoDiv.textContent = `Gen: ${generation} | ${speedText} | ${status}`;
        }

        function gameLoop() {
            const now = Date.now();
            const timeDelta = now - lastUpdateTime;
            const updateInterval = BASE_INTERVAL / currentSpeed;

            if (!paused && timeDelta >= updateInterval) {
                history.push(JSON.parse(JSON.stringify(grid)));
                historyAge.push(JSON.parse(JSON.stringify(age)));
                updateGrid();
                generation++;
                lastUpdateTime = now;
            }

            drawGrid();
            requestAnimationFrame(gameLoop);
        }

        // Button event listeners
        document.getElementById('btn-play').addEventListener('click', () => {
            paused = false;
            lastUpdateTime = Date.now();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            paused = true;
        });

        document.getElementById('btn-step-forward').addEventListener('click', () => {
            history.push(JSON.parse(JSON.stringify(grid)));
            historyAge.push(JSON.parse(JSON.stringify(age)));
            updateGrid();
            generation++;
        });

        document.getElementById('btn-step-backward').addEventListener('click', () => {
            if (history.length > 0) {
                grid = history.pop();
                age = historyAge.length > 0 ? historyAge.pop() : age;
                generation = Math.max(0, generation - 1);
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            initializeGrid(false);
        });

        document.getElementById('btn-random').addEventListener('click', () => {
            initializeGrid(true);
        });

        document.getElementById('btn-speed-slower').addEventListener('click', () => {
            speedIndex = Math.max(0, speedIndex - 1);
            currentSpeed = SPEEDS[speedIndex];
            lastUpdateTime = Date.now();
        });

        document.getElementById('btn-speed-faster').addEventListener('click', () => {
            speedIndex = Math.min(SPEEDS.length - 1, speedIndex + 1);
            currentSpeed = SPEEDS[speedIndex];
            lastUpdateTime = Date.now();
        });

        // Canvas click to toggle cells
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const col = Math.floor(x / CELL_SIZE);
            const row = Math.floor(y / CELL_SIZE);

            if (row >= 0 && row < gridHeight && col >= 0 && col < gridWidth) {
                grid[row][col] = 1 - grid[row][col];
            }
        });
    </script>
</body>
</html>
